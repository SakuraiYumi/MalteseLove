<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小狗的日常记录 🐾</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 导航栏保持不变 -->
        <nav class="nav-bar">
            <div class="user-avatars-small">
                <img src="https://i.pinimg.com/736x/1e/c6/4c/1ec64c28cbce99261f09741f21722619.jpg" alt="小狗 A" class="avatar-small">
                <img src="https://i.pinimg.com/736x/ab/e5/4b/abe54be077392cc5792ba49568955c56.jpg" alt="小狗 B" class="avatar-small">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">首页</a>
                <a href="daily.html" class="nav-btn active">日常</a>
                <a href="anniversary.html" class="nav-btn">纪念日</a>
                <a href="wish.html" class="nav-btn">心愿</a>
                <a href="food.html" class="nav-btn">美食</a>
                <a href="note.html" class="nav-btn">便签</a> 
            </div>
        </nav>

        <section class="card box-shadow">
            <p class="section-title">🐱 碎碎念日记流</p>
            
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 3px solid #2D2D2D;">
                <!-- 🌟 新增：日期选择器 -->
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span style="font-weight: bold; color: #555;">📅 日期:</span>
                    <input type="date" id="diary-date-input" style="padding: 5px 10px; border: 2px solid #2D2D2D; border-radius: 8px; font-family: inherit;">
                </div>

                <textarea id="diary-input" placeholder="在这写下今天的可爱日常吧..." style="width: 100%; height: 80px; padding: 10px; border: 2px solid #2D2D2D; border-radius: 10px; font-family: inherit; resize: none;"></textarea>
                <button id="add-diary-btn" onclick="saveDaily()" style="background-color: #FF879A; color: white; border: 2px solid #2D2D2D; padding: 8px; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0 #2D2D2D;">丢进小狗日记本 🐾</button>
            </div>

            <div id="diary-list"></div>
        </section>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script> <!-- 你的主要配置脚本 -->
    
    <!-- 🌟 专门处理日常日期的逻辑 -->
    <script>
        // 页面打开时，默认把日期选为今天
        document.getElementById('diary-date-input').value = new Date().toISOString().split('T')[0];

        // 页面加载完成后自动拉取数据
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadDailies, 500); // 稍微等0.5秒，确保数据库连接成功
        });

        // 🌟 读取并排序日记的魔法
        async function loadDailies() {
            // 兼容性获取客户端
            const activeClient = typeof supabaseClient !== 'undefined' ? supabaseClient : (typeof supabase !== 'undefined' ? supabase : null);
            if (!activeClient) {
                document.getElementById('diary-list').innerHTML = '<p style="text-align:center; color:#888;">云端连接中，请稍后...</p>';
                return;
            }

            // 获取当前的排序选择
            const sortOrder = document.getElementById('sort-order').value;
            const isAscending = sortOrder === 'asc'; // asc = 从旧到新(升序)，desc = 从新到旧(降序)

            // 从 daily_notes 表里拿数据
            const { data, error } = await activeClient
                .from('daily_notes')
                .select('*')
                .order('diary_date', { ascending: isAscending }) // 按日期排序
                .order('created_at', { ascending: isAscending }); // 如果同一天发了多条，按发布时间排序

            const listContainer = document.getElementById('diary-list');

            if (error || !data || data.length === 0) {
                listContainer.innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <img src="https://i.pinimg.com/736x/b2/4b/ab/b24babcb8298538e26c2425b699402a2.jpg" alt="空空如也" style="width: 80px; margin-bottom: 10px;">
                        <p style="color:#888;">本子里还空空的，快来写第一条吧！</p>
                    </div>`;
                return;
            }

            // 把数据渲染到页面上
            listContainer.innerHTML = data.map(item => `
                <div style="background: white; border: 2px solid #2D2D2D; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 3px 3px 0 #2D2D2D;">
                    <p style="font-size: 13px; color: #888; margin: 0 0 8px 0; font-weight: bold;">📅 ${item.diary_date || '某年某月某日'}</p>
                    <p style="margin: 0; color: #333; line-height: 1.5; white-space: pre-wrap;">${item.content}</p>
                </div>
            `).join('');
        }

        // 🌟 保存日记的魔法
        async function saveDaily() {
            const activeClient = typeof supabaseClient !== 'undefined' ? supabaseClient : (typeof supabase !== 'undefined' ? supabase : null);
            if (!activeClient) return alert("数据库还在连接，稍等一秒钟哦！");

            const content = document.getElementById('diary-input').value.trim();
            const diaryDate = document.getElementById('diary-date-input').value;
            
            if(!content) return alert("写点东西嘛汪！🐾");
            
            const { error } = await activeClient.from('daily_notes').insert([
                { content: content, diary_date: diaryDate }
            ]);
            
            if(!error) {
                // 清空输入框
                document.getElementById('diary-input').value = '';
                // 重新刷新下方的列表
                loadDailies(); 
                alert("丢进日记本成功啦！🎉");
            } else {
                alert("保存失败：" + error.message);
            }
        }
    </script>
</body>
</html>
