<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小狗的日常记录 🐾</title>
    <link rel="stylesheet" href="style.css?v=12">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <nav class="nav-bar">
            <div class="user-avatars-small">
                <img src="https://i.pinimg.com/736x/1e/c6/4c/1ec64c28cbce99261f09741f21722619.jpg" alt="小狗 A" class="avatar-small">
                <img src="https://i.pinimg.com/736x/ab/e5/4b/abe54be077392cc5792ba49568955c56.jpg" alt="小狗 B" class="avatar-small">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">首页</a>
                <a href="daily.html" class="nav-btn active">日常</a>
                <a href="anniversary.html" class="nav-btn">纪念日</a>
                <a href="wish.html" class="nav-btn">心愿</a>
                <a href="food.html" class="nav-btn">美食</a>
                <a href="hotel.html" class="nav-btn">酒店</a>
                <a href="checkin.html" class="nav-btn">打卡</a>
                <a href="note.html" class="nav-btn">便签</a> 
            </div>
        </nav>

        <section id="on-this-day" class="card box-shadow on-this-day" hidden>
            <p class="section-title">📅 那年今日</p>
            <div id="on-this-day-list"></div>
        </section>

        <section class="card box-shadow">
            <p class="section-title">🐱 碎碎念日记流</p>
            
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 3px solid #2D2D2D;">
                <!-- 🌟 日期选择器 -->
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span style="font-weight: bold; color: #555;">📅 日期:</span>
                    <input type="date" id="diary-date-input" style="padding: 5px 10px; border: 2px solid #2D2D2D; border-radius: 8px; font-family: inherit;">
                </div>

                <textarea id="diary-input" placeholder="在这写下今天的可爱日常吧..." style="width: 100%; height: 80px; padding: 10px; border: 2px solid #2D2D2D; border-radius: 10px; font-family: inherit; resize: none;"></textarea>

                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="file" id="diary-file" accept="image/*" style="display:none;" onchange="previewDiaryImage(this)">
                    <label for="diary-file" class="diary-upload-label">📷 可选一张照片</label>
                    <div id="diary-preview-box" class="diary-preview-box" hidden>
                        <img id="diary-preview" alt="预览">
                        <button type="button" onclick="clearDiaryImage()" class="diary-preview-clear">✖</button>
                    </div>
                </div>
                
                <!-- 🌟 按钮区域 -->
                <div style="display: flex; gap: 10px;">
                    <button id="add-diary-btn-new" onclick="saveNewDaily()" style="flex: 1; background-color: #FF879A; color: white; border: 2px solid #2D2D2D; padding: 8px; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0 #2D2D2D; transition: all 0.2s;">丢进小狗日记本 🐾</button>
                    
                    <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" style="display: none; background-color: #F3F4F6; color: #555; border: 2px solid #2D2D2D; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0 #2D2D2D;">取消 🚫</button>
                </div>
            </div>

            <!-- 🌟 排序控件 (更改为 onSortChange 触发，以便回到第一页) -->
            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold; color: #555; font-size: 16px;">🐾 历史记录</span>
                <select id="sort-order" onchange="onSortChange()" style="padding: 5px; border: 2px solid #2D2D2D; border-radius: 8px; cursor: pointer; font-family: inherit;">
                    <option value="desc">👇 从新到旧 (默认)</option>
                    <option value="asc">👆 从旧到新</option>
                </select>
            </div>

            <div id="diary-list"></div>

            <!-- 🌟 分页控件底座 -->
            <div id="pagination-controls" style="display: none; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 2px dashed #ddd;">
                <button id="prev-page-btn" onclick="prevPage()" style="background-color: #FFF; border: 2px solid #2D2D2D; padding: 6px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0 #2D2D2D; transition: all 0.2s;">👈 上一页</button>
                <span id="page-info" style="font-weight: bold; color: #555; font-size: 14px;">第 1 页 / 共 1 页</span>
                <button id="next-page-btn" onclick="nextPage()" style="background-color: #FFF; border: 2px solid #2D2D2D; padding: 6px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0 #2D2D2D; transition: all 0.2s;">下一页 👉</button>
            </div>
        </section>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js?v=10"></script>
    <script src="script.js?v=12"></script> 
    
    <script>
        let currentDailies = [];
        let editingId = null;
        let diaryPhotoFile = null;
        let diaryPhotoUrl = '';
        let diaryPhotoRemoved = false;

        // 🌟 分页相关的全局变量
        let currentPage = 1;
        const itemsPerPage = 20;
        let totalItems = 0;

        function escapeDaily(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function padDatePart(n) {
            return String(n).padStart(2, '0');
        }

        function datePartsFromField(value) {
            const raw = String(value || '').trim();
            const day = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (day && raw.indexOf('T') === -1) {
                return { year: Number(day[1]), md: day[2] + '-' + day[3] };
            }
            const cn = raw.match(/(\d{4})年(\d{1,2})月(\d{1,2})/);
            if (cn) {
                return { year: Number(cn[1]), md: padDatePart(cn[2]) + '-' + padDatePart(cn[3]) };
            }
            const d = new Date(raw);
            if (isNaN(d.getTime())) return null;
            return {
                year: d.getFullYear(),
                md: padDatePart(d.getMonth() + 1) + '-' + padDatePart(d.getDate())
            };
        }

        function todayMonthDay() {
            const now = new Date();
            return padDatePart(now.getMonth() + 1) + '-' + padDatePart(now.getDate());
        }

        function foodNameFromItem(item) {
            if (typeof parseFoodItem === 'function') return parseFoodItem(item).name;
            if (item.caption && item.caption.indexOf('||') !== -1) return item.caption.split('||')[0];
            return item.caption || '探店';
        }

        function showDiaryPreview(src) {
            const box = document.getElementById('diary-preview-box');
            const img = document.getElementById('diary-preview');
            if (!box || !img) return;
            img.src = src;
            box.hidden = false;
        }

        function hideDiaryPreview() {
            const box = document.getElementById('diary-preview-box');
            const img = document.getElementById('diary-preview');
            const file = document.getElementById('diary-file');
            if (box) box.hidden = true;
            if (img) img.src = '';
            if (file) file.value = '';
        }

        window.previewDiaryImage = function (input) {
            const file = input.files && input.files[0];
            if (!file) return;
            diaryPhotoFile = file;
            diaryPhotoRemoved = false;
            const reader = new FileReader();
            reader.onload = (e) => showDiaryPreview(e.target.result);
            reader.readAsDataURL(file);
        };

        window.clearDiaryImage = function () {
            diaryPhotoFile = null;
            diaryPhotoUrl = '';
            diaryPhotoRemoved = true;
            hideDiaryPreview();
        };

        async function uploadDiaryPhoto(file) {
            const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
            const fileName = `diary/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;
            const { error } = await supabaseClient.storage.from('Food').upload(fileName, file);
            if (error) throw error;
            const { data: { publicUrl } } = supabaseClient.storage.from('Food').getPublicUrl(fileName);
            return publicUrl;
        }

        document.getElementById('diary-date-input').value = new Date().toISOString().split('T')[0];

        window.onPuppyLoveReady(() => {
            loadDailies();
            loadOnThisDay();
        });

        // 🌟 当改变排序时，回到第一页再加载
        function onSortChange() {
            currentPage = 1;
            loadDailies();
        }

        // 🌟 读取数据的魔法 (已加入分页)
        async function loadDailies() {
            if (typeof supabaseClient === 'undefined' || !supabaseClient) {
                document.getElementById('diary-list').innerHTML = '<p style="text-align:center; color:#888;">云端连接中，请稍后...</p>';
                return;
            }

            const sortOrder = document.getElementById('sort-order').value;
            const isAscending = (sortOrder === 'asc'); 

            // 计算分页区间
            const from = (currentPage - 1) * itemsPerPage;
            const to = from + itemsPerPage - 1;

            // ⚠️ 修改：增加 { count: 'exact' } 获取总条数，增加 range 切片
            const { data, count, error } = await supabaseClient
                .from('diaries')
                .select('*', { count: 'exact' }) 
                .order('date', { ascending: isAscending })
                .order('id', { ascending: isAscending })
                .range(from, to); 

            const listContainer = document.getElementById('diary-list');
            const paginationControls = document.getElementById('pagination-controls');

            if (error) {
                listContainer.innerHTML = `<p style="text-align:center; color:red;">读取出错：${error.message}</p>`;
                return;
            }

            totalItems = count || 0;
            currentDailies = data || [];

            // 智能防空页：如果你把最后一页的最后一条删了，自动跳回上一页
            if (currentDailies.length === 0 && currentPage > 1) {
                currentPage--;
                loadDailies();
                return;
            }

            if (totalItems === 0) {
                listContainer.innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <img src="https://i.pinimg.com/736x/b2/4b/ab/b24babcb8298538e26c2425b699402a2.jpg" alt="空空如也" style="width: 80px; margin-bottom: 10px;">
                        <p style="color:#888;">本子里还空空的，快来写第一条吧！</p>
                    </div>`;
                paginationControls.style.display = "none";
                return;
            }

            // 渲染日记列表
            listContainer.innerHTML = currentDailies.map(item => {
                const photo = item.photo_url
                    ? `<img src="${escapeDaily(item.photo_url)}" alt="日记照片" class="diary-entry-photo">`
                    : '';
                return `
                <div style="background: white; border: 2px solid #2D2D2D; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 3px 3px 0 #2D2D2D; position: relative;">
                    <div style="position: absolute; right: 15px; top: 15px; display: flex; gap: 8px;">
                        <button onclick="startEdit(${item.id})" style="background: #E0F2FE; color: #0369A1; border: 2px solid #2D2D2D; padding: 2px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; font-weight: bold;">编辑 ✏️</button>
                        <button onclick="deleteItem('diaries', ${item.id}, afterDiaryChange)" style="background: #FFE4E6; color: #FF4D4D; border: 2px solid #2D2D2D; padding: 2px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; font-weight: bold;">删除 ✖</button>
                    </div>
                    <p style="font-size: 13px; color: #888; margin: 0 0 8px 0; font-weight: bold;">📅 ${escapeDaily(item.date || '无日期')}</p>
                    <p style="margin: 0; color: #333; line-height: 1.5; white-space: pre-wrap; padding-right: 120px;">${escapeDaily(item.text)}</p>
                    ${photo}
                </div>
            `;
            }).join('');

            updatePaginationUI();
        }

        // 🌟 更新底部分页按钮的状态
        function updatePaginationUI() {
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            
            document.getElementById('pagination-controls').style.display = totalPages > 1 ? "flex" : "none"; // 只有超过一页才显示分页栏
            document.getElementById('page-info').innerText = `第 ${currentPage} 页 / 共 ${totalPages} 页`;

            const prevBtn = document.getElementById('prev-page-btn');
            const nextBtn = document.getElementById('next-page-btn');

            // 禁用上一页
            if (currentPage === 1) {
                prevBtn.disabled = true;
                prevBtn.style.opacity = '0.5';
                prevBtn.style.cursor = 'not-allowed';
            } else {
                prevBtn.disabled = false;
                prevBtn.style.opacity = '1';
                prevBtn.style.cursor = 'pointer';
            }

            // 禁用下一页
            if (currentPage >= totalPages) {
                nextBtn.disabled = true;
                nextBtn.style.opacity = '0.5';
                nextBtn.style.cursor = 'not-allowed';
            } else {
                nextBtn.disabled = false;
                nextBtn.style.opacity = '1';
                nextBtn.style.cursor = 'pointer';
            }
        }

        // 🌟 翻页逻辑
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadDailies();
                window.scrollTo({ top: 300, behavior: 'smooth' }); // 翻页后稍微往上滚一点
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                loadDailies();
                window.scrollTo({ top: 300, behavior: 'smooth' }); // 翻页后稍微往上滚一点
            }
        }

        // 🌟 点击编辑按钮
        function startEdit(id) {
            const item = currentDailies.find(d => d.id === id);
            if (!item) return;

            document.getElementById('diary-input').value = item.text;
            document.getElementById('diary-date-input').value = item.date;
            editingId = id;
            diaryPhotoFile = null;
            diaryPhotoRemoved = false;
            diaryPhotoUrl = item.photo_url || '';
            if (diaryPhotoUrl) showDiaryPreview(diaryPhotoUrl);
            else hideDiaryPreview();

            const mainBtn = document.getElementById('add-diary-btn-new');
            mainBtn.innerText = "保存修改 💾";
            mainBtn.style.backgroundColor = "#4ADE80"; 

            document.getElementById('cancel-edit-btn').style.display = "inline-block";
            document.getElementById('diary-input').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 🌟 取消编辑状态
        function cancelEdit() {
            document.getElementById('diary-input').value = '';
            document.getElementById('diary-date-input').value = new Date().toISOString().split('T')[0];
            editingId = null;
            diaryPhotoFile = null;
            diaryPhotoUrl = '';
            diaryPhotoRemoved = false;
            hideDiaryPreview();

            const mainBtn = document.getElementById('add-diary-btn-new');
            mainBtn.innerText = "丢进小狗日记本 🐾";
            mainBtn.style.backgroundColor = "#FF879A";

            document.getElementById('cancel-edit-btn').style.display = "none";
        }

        function afterDiaryChange() {
            loadDailies();
            loadOnThisDay();
        }

        // 🌟 保存日记
        async function saveNewDaily() {
            if (typeof supabaseClient === 'undefined' || !supabaseClient) return alert("数据库还在连接，稍等一秒钟哦！");

            const content = document.getElementById('diary-input').value.trim();
            const diaryDate = document.getElementById('diary-date-input').value;
            const btn = document.getElementById('add-diary-btn-new');
            
            if(!content) return alert("写点东西嘛汪！🐾");

            let photoUrl = diaryPhotoUrl;
            btn.disabled = true;
            try {
                if (diaryPhotoFile) {
                    photoUrl = await uploadDiaryPhoto(diaryPhotoFile);
                } else if (editingId && diaryPhotoRemoved) {
                    photoUrl = null;
                }

                const payload = { text: content, date: diaryDate, photo_url: photoUrl || null };
            
                if (editingId) {
                    const { error } = await supabaseClient
                        .from('diaries')
                        .update(payload)
                        .eq('id', editingId);
                    
                    if (!error) {
                        alert("修改成功啦！✨");
                        cancelEdit(); 
                        afterDiaryChange();
                    } else {
                        alert(error.message && error.message.indexOf('photo_url') !== -1
                            ? '还差一步：请在 Supabase SQL 里跑 supabase-setup.sql 最后那行（给日记加照片字段）。'
                            : ('修改失败：' + error.message));
                    }
                } else {
                    const { error } = await supabaseClient.from('diaries').insert([payload]);
                    
                    if(!error) {
                        document.getElementById('diary-input').value = '';
                        diaryPhotoFile = null;
                        diaryPhotoUrl = '';
                        diaryPhotoRemoved = false;
                        hideDiaryPreview();
                        currentPage = 1;
                        afterDiaryChange();
                        alert("丢进日记本成功啦！🎉");
                    } else {
                        alert(error.message && error.message.indexOf('photo_url') !== -1
                            ? '还差一步：请在 Supabase SQL 里跑 supabase-setup.sql 最后那行（给日记加照片字段）。'
                            : ('保存失败：' + error.message));
                    }
                }
            } catch (err) {
                console.error(err);
                alert('保存失败：' + (err.message || '请稍后再试'));
            } finally {
                btn.disabled = false;
            }
        }

        async function loadOnThisDay() {
            const box = document.getElementById('on-this-day');
            const list = document.getElementById('on-this-day-list');
            if (!box || !list || !supabaseClient) return;
            const md = todayMonthDay();
            const thisYear = new Date().getFullYear();
            const [dRes, fRes, cRes, hRes] = await Promise.all([
                supabaseClient.from('diaries').select('*'),
                supabaseClient.from('memories').select('*'),
                supabaseClient.from('checkins').select('*').eq('status', 'done'),
                supabaseClient.from('hotels').select('*')
            ]);
            const pick = (rows, getDate) => (rows || []).filter((row) => {
                const parts = datePartsFromField(getDate(row));
                return parts && parts.md === md && parts.year < thisYear;
            });
            const diaries = pick(dRes.data, (row) => row.date);
            const foods = pick(fRes.data, (row) => row.visit_date);
            const checkins = pick(cRes.data, (row) => row.happen_at);
            const hotels = hRes.error ? [] : pick(hRes.data, (row) => row.visit_date);
            const years = [...new Set([
                ...diaries.map((row) => datePartsFromField(row.date).year),
                ...foods.map((row) => datePartsFromField(row.visit_date).year),
                ...checkins.map((row) => datePartsFromField(row.happen_at).year),
                ...hotels.map((row) => datePartsFromField(row.visit_date).year)
            ])].filter(Boolean).sort((a, b) => b - a);

            if (!years.length) {
                box.hidden = true;
                list.innerHTML = '';
                return;
            }

            box.hidden = false;
            list.innerHTML = years.map((year) => {
                const yearDiaries = diaries.filter((row) => datePartsFromField(row.date).year === year);
                const yearFoods = foods.filter((row) => datePartsFromField(row.visit_date).year === year);
                const yearCheckins = checkins.filter((row) => datePartsFromField(row.happen_at).year === year);
                const yearHotels = hotels.filter((row) => datePartsFromField(row.visit_date).year === year);
                const diaryHtml = yearDiaries.map((item) => {
                    const photo = item.photo_url
                        ? `<img src="${escapeDaily(item.photo_url)}" alt="那年今日" class="diary-entry-photo">`
                        : '';
                    return `<div class="on-this-day-entry">
                        <p class="on-this-day-text">${escapeDaily(item.text)}</p>
                        ${photo}
                    </div>`;
                }).join('') || '<p class="on-this-day-text" style="color:#888;">那天没有写日记，但留下了出门的痕迹。</p>';
                const bits = [];
                yearFoods.forEach((item) => bits.push({
                    kind: '探店',
                    name: foodNameFromItem(item),
                    href: `food.html?date=${year}-${md}`
                }));
                yearCheckins.forEach((item) => bits.push({
                    kind: '打卡',
                    name: item.place_name || '一个地点',
                    href: `checkin.html?date=${year}-${md}`
                }));
                const extra = bits.length
                    ? `<p class="on-this-day-extra">那天还去了 ${bits.map((bit) => `<a href="${bit.href}">${escapeDaily(bit.name)}</a>（${bit.kind}）`).join('、')}</p>`
                    : '';
                const stay = yearHotels.length
                    ? `<p class="on-this-day-extra">那天还住了 ${yearHotels.map((item) => `<a href="hotel.html?date=${year}-${md}">${escapeDaily(item.name || '一家酒店')}</a>`).join('、')}</p>`
                    : '';
                return `<div class="on-this-day-year">
                    <p class="on-this-day-year-title">${year} 年的今天</p>
                    ${diaryHtml}
                    ${extra}
                    ${stay}
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
