<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小狗汪汪队 💖 地图打卡</title>
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <div class="user-avatars-small">
                <img src="https://i.pinimg.com/736x/1e/c6/4c/1ec64c28cbce99261f09741f21722619.jpg" alt="小狗 A" class="avatar-small">
                <img src="https://i.pinimg.com/736x/ab/e5/4b/abe54be077392cc5792ba49568955c56.jpg" alt="小狗 B" class="avatar-small">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">首页</a>
                <a href="daily.html" class="nav-btn">日常</a>
                <a href="anniversary.html" class="nav-btn">纪念日</a>
                <a href="wish.html" class="nav-btn">心愿</a>
                <a href="food.html" class="nav-btn">美食</a>
                <a href="checkin.html" class="nav-btn active">打卡</a>
                <a href="note.html" class="nav-btn">便签</a>
            </div>
        </nav>

        <section class="card box-shadow" style="background:#FFF0F2;text-align:center;padding:20px;">
            <h2 style="margin:0 0 5px 0;color:#FF4D4D;">📍 地图打卡局</h2>
            <p style="margin:0;font-size:15px;color:#555;">约会、旅行、散步、电影… 吃饭还是去美食页哦</p>
        </section>

        <section class="card box-shadow" style="padding:16px;">
            <div class="checkin-search-wrap">
                <input type="text" id="checkin-search" placeholder="🔍 搜地点（玄武湖 / 悉尼歌剧院 / Tokyo）" class="checkin-input" style="margin-bottom:0;" autocomplete="off">
                <button type="button" id="checkin-search-btn" class="checkin-gps-btn" style="white-space:nowrap;">搜索</button>
            </div>
            <p class="checkin-search-hint">点下面的结果才会跳转；点错了改字就会出现新列表。</p>
            <div id="checkin-search-results" class="checkin-search-results" hidden></div>
            <div id="checkin-map" class="checkin-map"></div>
            <button type="button" onclick="locateNow()" class="checkin-gps-btn">📍 此刻定位</button>
        </section>

        <section class="card box-shadow" style="padding:20px;background:#FFFDF4;">
            <h3 style="margin:0 0 15px 0;">钉一个新点</h3>
            <label class="checkin-label">种类</label>
            <select id="checkin-type" onchange="onCheckinTypeChange()" class="checkin-input"></select>

            <div class="checkin-row">
                <div style="flex:1;">
                    <label class="checkin-label">日期</label>
                    <input type="date" id="checkin-date" class="checkin-input">
                </div>
                <div style="flex:1;">
                    <label class="checkin-label">时间</label>
                    <input type="time" id="checkin-time" class="checkin-input">
                </div>
            </div>

            <label class="checkin-label">地点名</label>
            <input type="text" id="checkin-place" placeholder="点地图或定位后会自动填" class="checkin-input">
            <input type="hidden" id="checkin-address">

            <label class="checkin-label">一句备注（可选）</label>
            <textarea id="checkin-note" rows="2" placeholder="今天想在这儿看日落…" class="checkin-input" style="resize:none;"></textarea>

            <div style="display:flex;gap:10px;align-items:center;margin:10px 0 16px;">
                <input type="file" id="checkin-file" accept="image/*" style="display:none;" onchange="previewCheckinImage(this)">
                <label for="checkin-file" class="checkin-upload-label">📷 可选一张照片</label>
                <div id="checkin-preview-box" style="display:none;width:56px;height:56px;border:2px solid #2D2D2D;border-radius:10px;overflow:hidden;position:relative;">
                    <img id="checkin-preview" alt="预览" style="width:100%;height:100%;object-fit:cover;">
                    <button type="button" onclick="clearCheckinImage()" style="position:absolute;top:0;right:0;background:rgba(255,77,77,.9);color:#fff;border:none;padding:0 5px;cursor:pointer;">✖</button>
                </div>
            </div>

            <div class="checkin-row">
                <button type="button" id="btn-plan" onclick="saveCheckin(true)" class="checkin-main-btn" style="background:#FEF3C7;">计划打卡 📌</button>
                <button type="button" id="btn-done" onclick="saveCheckin(false)" class="checkin-main-btn" style="background:#FEE440;">直接记录 ✓</button>
            </div>
        </section>

        <section class="card box-shadow" style="padding:16px;">
            <p class="section-title" style="margin-bottom:12px;">筛选</p>
            <div class="checkin-row" style="margin-bottom:0;">
                <select id="filter-type" class="checkin-input" onchange="filterCheckins()"></select>
                <select id="filter-status" class="checkin-input" onchange="filterCheckins()">
                    <option value="All">全部状态</option>
                    <option value="planned">计划中</option>
                    <option value="done">已完成</option>
                </select>
                <input type="date" id="filter-date" class="checkin-input" onchange="filterCheckins()">
            </div>
        </section>

        <section id="checkin-list" class="checkin-list"></section>
    </div>

    <script src="auth.js?v=7"></script>
    <script src="script.js?v=7"></script>
    <script src="checkin.js?v=7"></script>
</body>
</html>
