<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的纪念日 📅</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
         <nav class="nav-bar">
             <div class="user-avatars-small">
                <img src="https://i.pinimg.com/736x/1e/c6/4c/1ec64c28cbce99261f09741f21722619.jpg" alt="小狗 A" class="avatar-small">
                <img src="https://i.pinimg.com/736x/ab/e5/4b/abe54be077392cc5792ba49568955c56.jpg" alt="小狗 B" class="avatar-small">
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">首页</a>
                <a href="daily.html" class="nav-btn">日常</a>
                <a href="anniversary.html" class="nav-btn active">纪念日</a>
                <a href="wish.html" class="nav-btn">心愿</a>
                <a href="food.html" class="nav-btn">美食</a>
                <a href="checkin.html" class="nav-btn">打卡</a>
                <a href="note.html" class="nav-btn">便签</a> 
            </div>
         </nav>

        <section class="card box-shadow">
            <p class="section-title"><img src="https://img.icons8.com/emoji/48/000000/calendar-emoji.png" alt="icon"> 纪念日规划局</p>
            
            <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 3px solid #2D2D2D;">
                <input type="text" id="ann-input-title" placeholder="输入纪念日名称（如：认识1000天 / 狗狗生日）" style="width: 100%; padding: 10px; border: 2px solid #2D2D2D; border-radius: 10px; font-family: inherit; box-sizing: border-box;">
                
                <!-- 选项：每年还是单次 -->
                <div style="display: flex; gap: 20px; font-weight: bold; color: #555;">
                    <label><input type="radio" name="ann-type" value="yearly" checked> 每年过 (如生日/周年)</label>
                    <label><input type="radio" name="ann-type" value="specific"> 只有一次 (某年某月)</label>
                </div>

                <!-- 选项：农历还是新历 -->
                <div style="display: flex; gap: 20px; font-weight: bold; color: #555;">
                    <label><input type="radio" name="ann-calendar" value="solar" checked> 新历 🌞</label>
                    <label><input type="radio" name="ann-calendar" value="lunar"> 农历 🌙</label>
                </div>

                <input type="date" id="ann-input-date" style="width: 100%; padding: 10px; border: 2px solid #2D2D2D; border-radius: 10px; font-family: inherit; box-sizing: border-box;">
                
                <button onclick="saveAnniversary()" style="background-color: #F4A261; color: white; border: 2px solid #2D2D2D; padding: 10px; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0 #2D2D2D;">定格这个日子 📌</button>
            </div>
            
            <!-- 展示所有加过的纪念日 -->
            <div id="anniversary-list">
                 <p style="text-align:center; color:#888;">添加的纪念日会自动跑到主页哦！</p>
            </div>
        </section>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    
    <script>
        async function saveAnniversary() {
            // 🌟 兼容性抓取全局 Supabase 客户端，防止任何未定义导致的崩溃
            const activeClient = typeof supabaseClient !== 'undefined' ? supabaseClient : (window.supabaseClient || null);
            
            if (!activeClient) {
                return alert("云端连接还在初始化中，请稍等一秒钟再试哦汪！");
            }

            const title = document.getElementById('ann-input-title').value.trim();
            const dateVal = document.getElementById('ann-input-date').value; // 格式 YYYY-MM-DD
            
            const annTypeEl = document.querySelector('input[name="ann-type"]:checked');
            const annCalEl = document.querySelector('input[name="ann-calendar"]:checked');
            
            if (!annTypeEl || !annCalEl) {
                return alert("请勾选纪念日类型和历法哦汪！");
            }

            const isYearly = annTypeEl.value === 'yearly';
            const isLunar = annCalEl.value === 'lunar';

            if(!title || !dateVal) {
                return alert("名字和日期都要填哦汪！");
            }

            // 如果是“每年”重复的，我们存 MM-DD，否则存完整的 YYYY-MM-DD
            let targetDate = isYearly ? dateVal.substring(5) : dateVal; 

            let error = null;

            // 🌟 启动智能尝试：先尝试存入高阶数据（支持农历/每年重复）
            try {
                const response = await activeClient.from('anniversaries').insert([
                    { 
                        title: title, 
                        date: dateVal, // 保存完整公历，兼容你原本列表中的 item.date
                        is_yearly: isYearly, 
                        is_lunar: isLunar, 
                        target_date: targetDate 
                    }
                ]);
                error = response.error;
            } catch (err) {
                error = err;
            }

            // 🌟 【兼容退路】：如果因为数据库没加字段报错，立刻切换为保存基础字段，页面绝对不卡死！
            if (error && (error.message.includes("is_yearly") || error.message.includes("target_date") || error.message.includes("is_lunar") || error.code === "PGRST111")) {
                console.warn("⚠️ 检测到你的数据库还没有升级新字段，小狗正在为你切换到【兼容模式】写入...");
                const fallbackResult = await activeClient.from('anniversaries').insert([
                    { title: title, date: dateVal }
                ]);
                error = fallbackResult.error;
            }

            if(!error) {
                alert("纪念日添加成功啦！快去首页看看吧！");
                // 清空输入框
                document.getElementById('ann-input-title').value = '';
                document.getElementById('ann-input-date').value = '';
                
                // 成功后，立刻重新加载本页面的纪念日列表！
                if (typeof loadAnniversaries === 'function') {
                    loadAnniversaries();
                }
            } else {
                alert("保存失败了：" + error.message);
            }
        }
    </script>
</body>
</html>
