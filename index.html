    <!-- 基础配置与 Supabase 连接 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 🌟 智能纪念日自动读取与高精度计算脚本 (已修复版本) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 稍微等 0.5 秒，确保 script.js 里的 supabaseClient 已经准备好了
            setTimeout(fetchAndCalculateAnniversaries, 500);
        });

        async function fetchAndCalculateAnniversaries() {
            const container = document.getElementById('auto-anniversary-container');
            
            // 🐛 修复点 1：检查我们呼叫的是 supabaseClient，而不是 supabase
            const activeClient = typeof supabaseClient !== 'undefined' ? supabaseClient : null;
            if (!activeClient) {
                container.innerHTML = `
                    <div class="ann-item">
                        <div class="text">
                            <p class="ann-title">☁️ 云端连接中...</p>
                            <p class="ann-countdown" style="font-size:12px;">如果一直卡住，请刷新页面哦汪！</p>
                        </div>
                    </div>`;
                return;
            }

            // 1. 从 Supabase 抓取所有添加过的纪念日
            const { data, error } = await activeClient.from('anniversaries').select('*');
            
            if (error || !data || data.length === 0) {
                container.innerHTML = `
                    <div class="ann-item">
                        <img src="https://i.pinimg.com/736x/b2/4b/ab/b24babcb8298538e26c2425b699402a2.jpg" alt="gif icon">
                        <div class="text">
                            <p class="ann-title">还没有录入纪念日哦 🎉</p>
                            <p class="ann-countdown">去【纪念日】页面定格第一个日子吧！</p>
                        </div>
                    </div>
                `;
                return;
            }

            // 2. 遍历并利用算法，精确计算出每个日子
            let upcoming = data.map(item => {
                // 🐛 修复点 2：兼容旧数据（如果以前存的数据没有 is_yearly，就给个默认值）
                let isYearly = item.is_yearly === undefined ? true : item.is_yearly;
                let isLunar = item.is_lunar === undefined ? false : item.is_lunar;
                let targetDate = item.target_date || item.date; // 兼容旧日期格式

                let nextDateInfo = calculateNextDate(targetDate, isYearly, isLunar);
                return { 
                    ...item, 
                    daysLeft: nextDateInfo.daysLeft, 
                    actualNextDate: nextDateInfo.dateStr,
                    is_lunar: isLunar
                };
            });

            // 3. 过滤掉单次且已经过期的活动（daysLeft < 0），并按照距离今天最近的时间排序
            upcoming = upcoming.filter(item => item.daysLeft >= 0).sort((a, b) => a.daysLeft - b.daysLeft);

            if (upcoming.length === 0) {
                container.innerHTML = `
                    <div class="ann-item">
                        <img src="https://i.pinimg.com/736x/b2/4b/ab/b24babcb8298538e26c2425b699402a2.jpg" alt="gif icon">
                        <div class="text">
                            <p class="ann-title">所有的日子都成过去式啦~ ✨</p>
                            <p class="ann-countdown">快去添加新的未来规划吧！</p>
                        </div>
                    </div>
                `;
                return;
            }

            // 4. 取出最迫近的一个纪念日展示到主页
            let nearest = upcoming[0];
            let typeTag = nearest.is_lunar ? '🌙农历' : '🌞新历';
            
            // 5. 进度条平滑算分（越迫近，进度条越满，最大 100%，最小 5%）
            let percent = Math.max(5, 100 - (nearest.daysLeft / 365 * 100));

            // 6. 渲染回主页卡片
            container.innerHTML = `
                <div class="ann-item">
                    <img src="https://i.pinimg.com/736x/b2/4b/ab/b24babcb8298538e26c2425b699402a2.jpg" alt="gif icon">
                    <div class="text">
                        <p class="ann-title" style="margin:0; font-weight:bold; color:#2D2D2D;">${nearest.title} 🎉</p>
                        <p style="margin:4px 0 0 0; color: #888; font-size:12px;">(${typeTag}: ${nearest.actualNextDate})</p>
                        <p class="ann-countdown" style="margin-top:5px;">
                            ${nearest.daysLeft === 0 ? '✨ <span style="color:#FF879A; font-size:22px; font-weight:bold;">就是今天！</span> ✨' : `还有 <span style="color:#FF879A; font-size:22px; font-weight:bold;">${nearest.daysLeft}</span> 天`}
                        </p>
                    </div>
                </div>
                <div class="progress-bar" style="margin-top:15px; background:#FFE4E6; height:10px; border-radius:5px; overflow:hidden;">
                    <div class="progress-fill" style="width: ${percent}%; background:#FF879A; height:100%; border-radius:5px; transition: width 1s ease-in-out;"></div>
                </div>
            `;
        }

        // 🛠 核心：换算公历、农历和未来时间的算法
        function calculateNextDate(targetDateStr, isYearly, isLunar) {
            if (!targetDateStr) return { daysLeft: 9999, dateStr: '未知日期' };

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const currentYear = today.getFullYear();
            
            let tYear, tMonth, tDay;
            let parts = targetDateStr.split('-');
            
            if (parts.length === 2) {
                // 格式是 MM-DD (每年重复的旧格式)
                tYear = currentYear;
                tMonth = parseInt(parts[0]);
                tDay = parseInt(parts[1]);
            } else if (parts.length === 3) {
                // 格式是 YYYY-MM-DD
                tYear = isYearly ? currentYear : parseInt(parts[0]);
                tMonth = parseInt(parts[1]);
                tDay = parseInt(parts[2]);
            } else {
                return { daysLeft: 9999, dateStr: '格式错误' };
            }

            let nextSolarDate;

            if (isLunar && typeof Lunar !== 'undefined') {
                // 🌙 农历计算
                let lunarDate = Lunar.fromYmd(tYear, tMonth, tDay);
                let solarDate = lunarDate.getSolar();
                nextSolarDate = new Date(solarDate.getYear(), solarDate.getMonth() - 1, solarDate.getDay());
                
                // 如果是每年的日子，且今年的已经过了，推算到明年的农历公历日
                if (isYearly && nextSolarDate < today) {
                    lunarDate = Lunar.fromYmd(currentYear + 1, tMonth, tDay);
                    solarDate = lunarDate.getSolar();
                    nextSolarDate = new Date(solarDate.getYear(), solarDate.getMonth() - 1, solarDate.getDay());
                }
            } else {
                // 🌞 新历计算
                nextSolarDate = new Date(tYear, tMonth - 1, tDay);
                if (isYearly && nextSolarDate < today) {
                    nextSolarDate = new Date(currentYear + 1, tMonth - 1, tDay);
                }
            }

            // 计算时间戳差值转为天数
            const diffTime = nextSolarDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            let displayDate = `${nextSolarDate.getFullYear()}-${String(nextSolarDate.getMonth()+1).padStart(2,'0')}-${String(nextSolarDate.getDate()).padStart(2,'0')}`;
            
            return { daysLeft: diffDays, dateStr: displayDate };
        }
    </script>
